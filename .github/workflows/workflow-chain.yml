name: workflow-chain
# Webhook: instantly advance workflow stage when a PR is merged

on:
  pull_request:
    types: [closed]

jobs:
  advance:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Advance issue workflow label on PR merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prLabels = pr.labels.map(l => l.name);

            const workflowLabels = ['workflow/research', 'workflow/plan', 'workflow/implement'];
            let activeLabel = workflowLabels.find(l => prLabels.includes(l));
            if (!activeLabel) {
              const branch = pr.head.ref;
              const branchLabelMap = {
                'research/': 'workflow/research',
                'plan/':     'workflow/plan',
                'impl/':     'workflow/implement',
                'review/':   'workflow/test',
              };
              const matchedPrefix = Object.keys(branchLabelMap).find(p => branch.startsWith(p));
              if (matchedPrefix) {
                activeLabel = branchLabelMap[matchedPrefix];
                console.log(`PR #${pr.number} missing workflow label — derived "${activeLabel}" from branch "${branch}"`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: [activeLabel],
                  });
                } catch (labelErr) {
                  console.log(`PR #${pr.number}: could not add workflow label (${labelErr.status} ${labelErr.message})`);
                }
              } else {
                console.log(`PR #${pr.number} has no workflow label and branch "${branch}" doesn't match — skipping`);
                return;
              }
            }

            const body = pr.body || '';
            const parentMatch = body.match(/(?:Closes|parent)\s*#(\d+)/i);
            if (!parentMatch) {
              console.log(`PR #${pr.number}: no parent issue reference in body — can't advance`);
              return;
            }
            const parentNumber = parseInt(parentMatch[1]);

            // ── v4 人机共做 (2026-08-11): taste-draft 识别 ──────────────
            // 父 Issue body 带 content_ownership: taste-draft = 品味内容草稿。
            // 草稿 merge 后: 推进到 status/human-review(非 status/done),
            // Issue 保持 open, assign 用户定稿。机械 Issue 走原 status/done + close。
            let parentIssue = null;
            try {
              parentIssue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
              });
            } catch (e) {
              console.log(`PR #${pr.number}: could not fetch parent issue #${parentNumber} — ${e.message}`);
            }
            const parentBody = parentIssue ? (parentIssue.data.body || '') : '';
            const isTasteDraft = /content_ownership:\s*taste-draft/i.test(parentBody);

            // ── v4 防呆修复 (2026-08-11): human-review 状态判断 ────────────
            // 原实现 `activeLabel === 'status/human-review'` 是死代码 —— activeLabel
            // 只来自 PR labels (research/plan/implement) 或分支前缀 (research/plan/
            // impl/review→test), 永远不可能等于 status/human-review, 防呆从未执行。
            // 正确依据是父 Issue 当前 labels: 只要在 status/human-review, 任何后续
            // merge (用户定稿 PR / review 补充 PR / 异常前缀 PR) 都不 close、不推进。
            const parentLabels = parentIssue ? (parentIssue.data.labels || []).map(l => l.name) : [];
            const isParentHumanReview = parentLabels.includes('status/human-review');

            const nextStage = {
              'workflow/research':  'workflow/plan',
              'workflow/plan':      'workflow/implement',
              'workflow/implement': isTasteDraft ? 'status/human-review' : 'status/done',
              'status/done':        null,
              'status/human-review': null,
            };

            const nextLabel = nextStage[activeLabel];

            if (isParentHumanReview) {
              // v4 防呆(修复后可达): 父 Issue 已在 status/human-review 时的再次 merge
              // (用户定稿 PR / review 补充 PR / 任何前缀)只更新评论,
              // 不 close、不推进 —— close 由用户手动执行(定稿即 close)。
              console.log(`PR #${pr.number} merged → Issue #${parentNumber} at status/human-review (awaiting user) — not closing`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                body: '✅ 定稿 PR merged。若此为本 Issue 最终定稿,请 close 本 Issue 完成校准。',
              });
            } else if (nextLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                labels: [nextLabel],
              });
              // Label hygiene (2026-08-13): remove ALL workflow stage labels
              // except nextLabel. Previously only activeLabel (the PR's own
              // stage) was removed, so workflow/available lingered on every
              // issue for its whole lifecycle → reconcile() re-injected it
              // every tick → the ungated preprocess path spawned phantom
              // research agents (14 duplicate spawns observed for #393).
              const stageLabels = [
                'workflow/available', 'workflow/research',
                'workflow/plan', 'workflow/implement',
                'workflow/self-correct',
              ];
              for (const sl of stageLabels) {
                if (sl !== nextLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentNumber,
                    name: sl,
                  }).catch(() => {});
                }
              }
              console.log(`PR #${pr.number} merged → Issue #${parentNumber}: ${activeLabel} → ${nextLabel}`);

              // Close the issue ONLY when reaching status/done (mechanical).
              // taste-draft 草稿 merge ≠ 定稿 — 保持 open 等用户校准。
              if (nextLabel === 'status/done') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentNumber,
                  state: 'closed',
                });
                console.log(`Issue #${parentNumber} closed (done)`);
              }

              // v4: taste-draft 草稿 merge → assign 用户(队列入口),不 close
              if (nextLabel === 'status/human-review') {
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentNumber,
                    assignees: [context.repo.owner],
                  });
                  console.log(`Issue #${parentNumber} assigned to ${context.repo.owner} (human-review queue)`);
                } catch (assignErr) {
                  console.log(`Issue #${parentNumber}: assign failed (${assignErr.message})`);
                }
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                body: nextLabel === 'status/done'
                  ? `🎉 Issue resolved — label: **${nextLabel}**`
                  : nextLabel === 'status/human-review'
                    ? `🧪 草稿已 merge (#${pr.number}) — 等待定稿。打开本 Issue → 微调草稿 → push → close 即定稿(差异会记录进 docs/TASTE.md)。`
                    : `⏩ PR #${pr.number} (${activeLabel}) merged → advancing to **${nextLabel}**`,
              });
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                state: 'closed',
              });
              // Remove ALL workflow stage labels (hygiene, 2026-08-13) —
              // same rationale as the advance branch above.
              const stageLabels = [
                'workflow/available', 'workflow/research',
                'workflow/plan', 'workflow/implement',
                'workflow/self-correct',
              ];
              for (const sl of stageLabels) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentNumber,
                  name: sl,
                }).catch(() => {});
              }

              console.log(`PR #${pr.number} merged → Issue #${parentNumber} closed (implement → done)`);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                body: '🎉 Issue resolved — PR merged and complete.',
              });
            }
