name: deploy
# Auto-build and deploy when an implement PR is merged to main
# Builds web assets via Vite and deploys to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_num:
        description: 'Merged PR number'
        required: false
        type: string

jobs:
  check-implement:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should_deploy }}
      pr-num: ${{ steps.check.outputs.pr_num }}
    permissions:
      pull-requests: read
    steps:
      - name: Check if merged PR is from implement branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUM: ${{ inputs.pr_num || '' }}
        run: |
          PR_NUM="$INPUT_PR_NUM"

          if [ -z "$PR_NUM" ]; then
            COMMIT_SHA="${{ github.sha }}"
            echo "No input PR. Checking commit $COMMIT_SHA..."
            PR_NUM=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls" \
              --jq '.[] | select(.state == "closed" and .merged_at != null) | .number' 2>/dev/null | head -1)
          fi

          if [ -z "$PR_NUM" ]; then
            echo "No merged PR found. Skipping deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking PR #$PR_NUM head branch for implement prefix..."

          FROM_BRANCH=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" \
            --jq '.head.ref' 2>/dev/null)

          if [ -z "$FROM_BRANCH" ]; then
            echo "Could not determine PR head branch. Skipping deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "PR head branch: $FROM_BRANCH"

          if [[ "$FROM_BRANCH" == impl/* ]]; then
            echo "PR #$PR_NUM is from implement branch ($FROM_BRANCH) → build + deploy!"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "pr_num=$PR_NUM" >> $GITHUB_OUTPUT
          else
            echo "PR #$PR_NUM is from $FROM_BRANCH (not implement) → skip."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    needs: check-implement
    if: needs.check-implement.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }} (PR #${{ needs.check-implement.outputs.pr-num }})"
          body: |
            🚀 Auto-build from merged PR #${{ needs.check-implement.outputs.pr-num }}
            Triggered by: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
