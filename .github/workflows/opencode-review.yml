name: review
# CI testing — runs ONLY on implement-stage PRs
# Uses Godot headless for GDScript testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-report:
    if: startsWith(github.event.pull_request.head.ref, 'impl/')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot Engine
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-4.7.1-${{ runner.os }}-${{ hashFiles('.github/workflows/opencode-review.yml') }}
          restore-keys: godot-4.7.1-${{ runner.os }}-

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          cache: true

      - name: Verify Godot
        run: godot --version

      # ── 活跃游戏解析（2026-08-18, 一次一个游戏）──────────────────
      # 从 game-env/manifest.yaml 读 game.active → GAME_DIR（如 mini-pong/）
      - name: Resolve active game from manifest
        id: active-game
        run: |
          GAME_ACTIVE=$(python3 -c "import re,sys; txt=open('game-env/manifest.yaml',encoding='utf-8').read(); m=re.search(r'^game:\s*$',txt,re.M); am=re.search(r'active:\s*(\S+)',txt[m.end():m.end()+200]) if m else None; print(am.group(1) if am else 'mini-pong')")
          GAME_DIR=$(python3 -c "import re,sys; txt=open('game-env/manifest.yaml',encoding='utf-8').read(); active='$GAME_ACTIVE'; m=re.search(r'^game:\s*$',txt,re.M); sm=re.search(r'subprojects:\s*\n(.*?)(?=\n\S|\Z)',txt[m.end():],re.S) if m else None; pm=re.search(r'^\s*'+re.escape(active)+r':\s*\n(.*?)(?=\n\s{4}\S|\Z)',sm.group(1),re.S|re.M) if sm else None; pm2=re.search(r'path:\s*(\S+)',pm.group(1)) if pm else None; print(pm2.group(1).rstrip('/') if pm2 else active)")
          echo "game_active=$GAME_ACTIVE" >> $GITHUB_OUTPUT
          echo "game_dir=$GAME_DIR" >> $GITHUB_OUTPUT
          echo "active game: $GAME_ACTIVE (dir: $GAME_DIR)"

      - name: Pre-flight compile check
        id: compile
        run: |
          GAME_DIR="${{ steps.active-game.outputs.game_dir }}"
          exit_code=0
          if [ -f "$GAME_DIR/tests/check_compile.gd" ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            if godot --path "$GAME_DIR/" --headless --script tests/check_compile.gd > compile-output.log 2>&1; then
              exit_code=0
            else
              exit_code=$?
            fi
            cat compile-output.log
            if [ "$exit_code" -ne 0 ] || grep -qE "FAIL|SCRIPT ERROR" compile-output.log; then
              echo "❌ COMPILE ERROR(s) in $GAME_DIR scripts"
              exit_code=1
            fi
          elif [ -d "$GAME_DIR" ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            if godot --path "$GAME_DIR/" --headless --quit > compile-output.log 2>&1; then
              exit_code=0
            else
              exit_code=$?
            fi
            if [ "$exit_code" -ne 0 ] || grep -qE "FAIL|SCRIPT ERROR" compile-output.log; then
              echo "❌ COMPILE ERROR(s) detected"
              exit_code=1
            fi
          else
            echo "SKIP: $GAME_DIR/ not found"
          fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run GDScript tests
        id: test
        run: |
          GAME_DIR="${{ steps.active-game.outputs.game_dir }}"
          if [ -f "$GAME_DIR/tests/run_tests.gd" ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            if godot --path "$GAME_DIR/" --headless --script tests/run_tests.gd > test-output.log 2>&1; then
              TEST_EXIT=0
            else
              TEST_EXIT=$?
            fi
            echo "Test output:"
            cat test-output.log
            if [ "$TEST_EXIT" -ne 0 ] || grep -qE "SCRIPT ERROR" test-output.log || grep -qE "[1-9][0-9]* failed|Failed[:：] *[1-9]" test-output.log; then
              echo "❌ Error(s) detected in test output — marking as failure"
              echo "exit_code=1" >> $GITHUB_OUTPUT
            else
              echo "exit_code=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP: $GAME_DIR/tests/run_tests.gd not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run smoke test
        id: smoke
        run: |
          GAME_DIR="${{ steps.active-game.outputs.game_dir }}"
          if [ -f "$GAME_DIR/tests/smoke_test.gd" ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            if godot --path "$GAME_DIR/" --headless --script tests/smoke_test.gd > smoke-output.log 2>&1; then
              echo "exit_code=0" >> $GITHUB_OUTPUT
            else
              echo "exit_code=$?" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP: $GAME_DIR/tests/smoke_test.gd not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate scaffold
        id: scaffold
        run: |
          GAME_DIR="${{ steps.active-game.outputs.game_dir }}"
          if [ -d "$GAME_DIR" ]; then
            if godot --path "$GAME_DIR/" --headless --quit > scaffold-output.log 2>&1; then
              echo "exit_code=0" >> $GITHUB_OUTPUT
            else
              echo "exit_code=$?" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP: $GAME_DIR/ not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Test gate — block merge on failure
        if: steps.compile.outputs.exit_code != '0' || steps.test.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0' || steps.scaffold.outputs.exit_code != '0' || (steps.compile.outputs.TEST_RAN != 'true' && steps.test.outputs.TEST_RAN != 'true' && steps.smoke.outputs.TEST_RAN != 'true')
        run: |
          echo "❌ Tests FAILED (compile: ${{ steps.compile.outputs.exit_code }}, unit: ${{ steps.test.outputs.exit_code }}, smoke: ${{ steps.smoke.outputs.exit_code }}, scaffold: ${{ steps.scaffold.outputs.exit_code }}). Blocking merge."
          echo "TEST_RAN flags — compile: ${{ steps.compile.outputs.TEST_RAN }}, unit: ${{ steps.test.outputs.TEST_RAN }}, smoke: ${{ steps.smoke.outputs.TEST_RAN }}"
          exit 1

      - name: Upload test output artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-${{ github.event.pull_request.number }}
          path: |
            compile-output.log
            test-output.log
            smoke-output.log
            scaffold-output.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Comment failure summary on PR
        if: steps.test.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0'
        env:
          UNIT_EXIT: ${{ steps.test.outputs.exit_code }}
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
        uses: actions/github-script@v7
        with:
          script: |
            var fs = require('fs');
            var summary = '';

            if (process.env.UNIT_EXIT !== '0') {
              var output = fs.readFileSync('test-output.log', 'utf8');
              var lines = output.split('\n');
              var failLines = lines.filter(function(l) {
                return l.includes('FAIL') || l.includes('AssertionError') || l.includes('failed') || l.includes('error');
              });
              summary += '### ❌ Unit Tests Failed\n```\n' + failLines.slice(-15).join('\n').substring(0, 500) + '\n```\n\n';
            }

            if (process.env.SMOKE_EXIT !== '0') {
              var smokeOutput = fs.readFileSync('smoke-output.log', 'utf8');
              var smokeLines = smokeOutput.split('\n');
              var smokeFails = smokeLines.filter(function(l) {
                return l.includes('❌');
              });
              summary += '### ❌ Smoke Test Failed\n```\n' + smokeFails.slice(-15).join('\n').substring(0, 500) + '\n```\n\n';
            }

            var baseUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            var runUrl = baseUrl + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            var body = 'Tests FAILED — dispatcher will auto-fix\n\n' + (summary || 'See run logs') + '\n' + runUrl;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
