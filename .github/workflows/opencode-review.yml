name: review
# CI testing — runs ONLY on implement-stage PRs
# Uses Godot headless for GDScript testing

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-report:
    if: startsWith(github.event.pull_request.head.ref, 'impl/')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot Engine
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-4.7.1-${{ runner.os }}-${{ hashFiles('.github/workflows/opencode-review.yml') }}
          restore-keys: godot-4.7.1-${{ runner.os }}-

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-double-precision: false
          cache: true

      - name: Verify Godot
        run: godot --version

      - name: Pre-flight compile check
        id: compile
        run: |
          exit_code=0
          found=0
          for script in $(find gdscripts/ tests/ -name '*.gd' 2>/dev/null); do
            found=1
            output=$(godot --headless --check-only "$script" 2>&1) || true
            if echo "$output" | grep -q "SCRIPT ERROR"; then
              echo "❌ COMPILE ERROR: $script"
              echo "$output" | grep "SCRIPT ERROR"
              exit_code=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
          fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Pre-flight compile check — Mini Pong
        id: compile-mini-pong
        run: |
          exit_code=0
          if [ -f mini-pong/tests/check_compile.gd ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            godot --path mini-pong/ --headless --script tests/check_compile.gd > compile-mini-pong-output.log 2>&1 && true
            exit_code=$?
            cat compile-mini-pong-output.log
            if grep -qE "FAIL|SCRIPT ERROR" compile-mini-pong-output.log; then
              echo "❌ COMPILE ERROR(s) in Mini Pong scripts"
              exit_code=1
            fi
          elif [ -d mini-pong ]; then
            # Fallback: quick project validation if check_compile.gd missing
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            godot --path mini-pong/ --headless --quit > compile-mini-pong-output.log 2>&1 && true
            exit_code=$?
            if grep -qE "FAIL|SCRIPT ERROR" compile-mini-pong-output.log; then
              echo "❌ COMPILE ERROR(s) detected"
              exit_code=1
            fi
          else
            echo "SKIP: mini-pong/ not found"
          fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run GDScript tests
        id: test
        run: |
          if [ -f tests/run_tests.gd ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            godot --headless --script tests/run_tests.gd > test-output.log 2>&1 && true
            TEST_EXIT=$?
            echo "Test output:"
            cat test-output.log
            # SCRIPT ERROR in output = test failure
            if grep -qE "SCRIPT ERROR" test-output.log; then
              echo "❌ Error(s) detected in test output — marking as failure"
              echo "exit_code=1" >> $GITHUB_OUTPUT
            else
              echo "exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP: tests/run_tests.gd not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run smoke test
        id: smoke
        run: |
          if [ -f tests/smoke_test.gd ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            godot --headless --script tests/smoke_test.gd > smoke-output.log 2>&1 && true
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "SKIP: tests/smoke_test.gd not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate sub-project scaffold
        id: rnp
        run: |
          if [ -d rainy-night-prometheus ]; then
            godot --path rainy-night-prometheus/ --headless --quit > rnp-output.log 2>&1 && true
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "SKIP: rainy-night-prometheus/ not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate Mini Pong scaffold
        id: mini-pong
        run: |
          if [ -d mini-pong ]; then
            godot --path mini-pong/ --headless --quit > mini-pong-output.log 2>&1 && true
            echo "exit_code=$?" >> $GITHUB_OUTPUT
          else
            echo "SKIP: mini-pong/ not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run Mini Pong tests
        id: mini-pong-test
        run: |
          if [ -f mini-pong/tests/run_tests.gd ]; then
            echo "TEST_RAN=true" >> $GITHUB_OUTPUT
            godot --path mini-pong/ --headless --script tests/run_tests.gd > mini-pong-test-output.log 2>&1 && true
            TEST_EXIT=$?
            echo "Test output:"
            cat mini-pong-test-output.log
            # SCRIPT ERROR in output = test failure
            if grep -qE "SCRIPT ERROR" mini-pong-test-output.log; then
              echo "❌ Error(s) detected in test output — marking as failure"
              echo "exit_code=1" >> $GITHUB_OUTPUT
            else
              echo "exit_code=$TEST_EXIT" >> $GITHUB_OUTPUT
            fi
          else
            echo "SKIP: mini-pong/tests/run_tests.gd not found"
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Test gate — block merge on failure
        if: steps.compile.outputs.exit_code != '0' || steps.compile-mini-pong.outputs.exit_code != '0' || steps.test.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0' || steps.rnp.outputs.exit_code != '0' || steps.mini-pong.outputs.exit_code != '0' || steps.mini-pong-test.outputs.exit_code != '0' || (steps.compile.outputs.TEST_RAN != 'true' && steps.compile-mini-pong.outputs.TEST_RAN != 'true' && steps.test.outputs.TEST_RAN != 'true' && steps.smoke.outputs.TEST_RAN != 'true' && steps.mini-pong-test.outputs.TEST_RAN != 'true')
        run: |
          echo "❌ Tests FAILED (compile: ${{ steps.compile.outputs.exit_code }}, compile-mini-pong: ${{ steps.compile-mini-pong.outputs.exit_code }}, unit: ${{ steps.test.outputs.exit_code }}, smoke: ${{ steps.smoke.outputs.exit_code }}, scaffold: ${{ steps.rnp.outputs.exit_code }}, mini-pong: ${{ steps.mini-pong.outputs.exit_code }}, mini-pong-tests: ${{ steps.mini-pong-test.outputs.exit_code }}). Blocking merge."
          echo "TEST_RAN flags — compile: ${{ steps.compile.outputs.TEST_RAN }}, compile-mini-pong: ${{ steps.compile-mini-pong.outputs.TEST_RAN }}, unit: ${{ steps.test.outputs.TEST_RAN }}, smoke: ${{ steps.smoke.outputs.TEST_RAN }}, mini-pong-tests: ${{ steps.mini-pong-test.outputs.TEST_RAN }}"
          exit 1

      - name: Upload test output artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-${{ github.event.pull_request.number }}
          path: |
            test-output.log
            smoke-output.log
            rnp-output.log
            mini-pong-output.log
            mini-pong-test-output.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Comment failure summary on PR
        if: steps.test.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0'
        env:
          UNIT_EXIT: ${{ steps.test.outputs.exit_code }}
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
        uses: actions/github-script@v7
        with:
          script: |
            var fs = require('fs');
            var summary = '';

            if (process.env.UNIT_EXIT !== '0') {
              var output = fs.readFileSync('test-output.log', 'utf8');
              var lines = output.split('\n');
              var failLines = lines.filter(function(l) {
                return l.includes('FAIL') || l.includes('AssertionError') || l.includes('failed') || l.includes('error');
              });
              summary += '### ❌ Unit Tests Failed\n```\n' + failLines.slice(-15).join('\n').substring(0, 500) + '\n```\n\n';
            }

            if (process.env.SMOKE_EXIT !== '0') {
              var smokeOutput = fs.readFileSync('smoke-output.log', 'utf8');
              var smokeLines = smokeOutput.split('\n');
              var smokeFails = smokeLines.filter(function(l) {
                return l.includes('❌');
              });
              summary += '### ❌ Smoke Test Failed\n```\n' + smokeFails.slice(-15).join('\n').substring(0, 500) + '\n```\n\n';
            }

            var baseUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            var runUrl = baseUrl + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            var body = 'Tests FAILED — dispatcher will auto-fix\n\n' + (summary || 'See run logs') + '\n' + runUrl;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
